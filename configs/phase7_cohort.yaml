# Phase 7 cohort selection rules — FROZEN (2026-08-19)
# Selection uses only Phase 5/6.5 information. Literature availability is NOT a criterion.

phase7:
  strata:
    A:
      label: "computational impact + functional LOF"
      revel: ">=0.644"
      findlay: "<0"
    B:
      label: "computational impact + functional normal"
      revel: ">=0.644"
      findlay: ">=0"
    C:
      label: "computational tolerance + functional LOF"
      revel: "<=0.290"
      findlay: "<0"
    D:
      label: "computational tolerance + functional normal"
      revel: "<=0.290"
      findlay: ">=0"
    E:
      label: "intermediate computational evidence (REVEL 0.290-0.644) with functional score"
      revel: "intermediate"
      findlay: "available"
  target_per_stratum: 10
  selection_method: "deterministic even-spacing by protein position (no random sampling, no literature criterion)"
  note: "If a stratum has fewer than target variants, all are selected and the shortfall is documented."
